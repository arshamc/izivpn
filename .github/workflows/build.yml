name: Build IZI VPN APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Get dependencies
        run: |
          flutter pub upgrade flutter_v2ray
          flutter pub get

      - name: Static Analysis
        run: |
          flutter analyze > analysis.txt || true
          cat analysis.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis.txt
          git commit -m "chore: save analysis report [skip ci]" || true
          git push origin main || true
          if grep -q "error •" analysis.txt; then
            echo "Critical compile errors found in Static Analysis!"
            exit 1
          fi

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: izi-vpn-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: izi-vpn-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-preview
          name: "izi vpn v2.0.0-preview (Release Candidate)"
          body: |
            ## 🚀 izi vpn v2.0.0-preview

            ### Key Updates:
            - **Android 14 & Xiaomi Compatibility**: Isolated native `:RunSoLibV2RayDaemon` process and automatic notification permissions preventing foreground service timeouts.
            - **Fast Parallel Ping Engine**: Multi-threaded pinging via official Google network endpoint (`gstatic.com/generate_204`).
            - **AdMob Anti-Ban State Machine**: Official Google Test IDs active, post-connection milestone interstitial with 5-second hard timeout, app lifecycle guard, and 2-Hour VIP Pass via Rewarded Ads.
            - **Multi-Source Config Sync**: 20 global servers synced with fallback mirrors.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
